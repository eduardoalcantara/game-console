# Pacotes de franchise — aplicados a TODOS os sistemas na curadoria RG43H
# Match por regex no nome do ficheiro ROM (case-insensitive).
# Preferencia de regiao USA via plan_group (nao include_all_regions).
# Exclusoes evitam falsos positivos (ex.: Bass fishing vs Mega Man).

packs:
  - id: mario
    patterns:
      - "(?i)super mario"
      - "(?i)mario kart"
      - "(?i)mario party"
      - "(?i)mario (golf|tennis|rpg|pinball|bros)"
      - "(?i)mario & luigi"
      - "(?i)mario vs"
      - "(?i)paper mario"
      - "(?i)dr\\.? ?mario"
      - "(?i)yoshi'?s? (island|story|cookie)"
      - "(?i)^yoshi(\\.|$| )"
      - "(?i)wario land"
      - "(?i)warioware"
      - "(?i)wario.?ware"
      - "(?i)luigi'?s mansion"
      - "(?i)donkey kong"
    exclude:
      - "(?i)early years"
      - "(?i)nakayoshi"
      - "(?i)mahjong"
      - "(?i)hack"
      - "(?i)missing stars"
      - "(?i)last impact"
      - "(?i)star road"
      - "(?i)galactic journey"
      - "(?i)odyssey 64"
      - "(?i)fallen stars"
      - "(?i)escape from the jail"
      - "(?i)super wario 64"
      - "(?i)multiplayer"
      - "(?i)w00ting"

  - id: sonic
    patterns:
      - "(?i)sonic the hedgehog"
      - "(?i)sonic (advance|battle|spinball|blast|adventure|generations|racing|riders|pinball)"
      - "(?i)sonic & knuckles"
      - "(?i)sonic and knuckles"
      - "(?i)knuckles'? chaotix"
      - "(?i)^sonic(\\.|$| )"
    exclude:
      - "(?i)aerobiz"
      - "(?i)sonic blast man"
      - "(?i)sonic wings"
      - "(?i)sonic spike"
      - "(?i)edusoft"
      - "(?i)adventure 64"

  - id: megaman
    patterns:
      - "(?i)mega ?man"
      - "(?i)megaman"
      - "(?i)rockman"
      - "(?i)maverick hunter"
      - "(?i)powered up"
    exclude:
      - "(?i)bass master"
      - "(?i)black bass"
      - "(?i)bassin"
      - "(?i)bass fishing"
      - "(?i)bass tournament"
      - "(?i)bass hunter"
      - "(?i)monster bass"
      - "(?i)bass tsuri"
      - "(?i)top water bass"
      - "(?i)super bass"

  - id: racing
    patterns:
      - "(?i)mario kart"
      - "(?i)\\bkart\\b"
      - "(?i)racing"
      - "(?i)racer"
      - "(?i)f-zero"
      - "(?i)outrun"
      - "(?i)road rash"
      - "(?i)ridge racer"
      - "(?i)wipeout"
      - "(?i)gran turismo"
      - "(?i)top gear"
      - "(?i)micro machines"
      - "(?i)virtua racing"
      - "(?i)wave race"
      - "(?i)excitebike"
      - "(?i)diddy kong racing"
      - "(?i)hang-on"
      - "(?i)hang on"
      - "(?i)rad racer"
      - "(?i)rock n.? ?roll racing"
      - "(?i)rock.?n.?roll racing"
      - "(?i)need for speed"
      - "(?i)sega rally"
      - "(?i)daytona"
      - "(?i)burnout"
      - "(?i)crash team racing"
      - "(?i)moto racer"
      - "(?i)uniracers"
      - "(?i)stunt race"
      - "(?i)gp-1"
      - "(?i)f1 roc"
      - "(?i)f1 pole"
      - "(?i)super monaco"
      - "(?i)outrunners"
      - "(?i)san francisco rush"
      - "(?i)beetle adventure racing"
      - "(?i)star wars.*racer"
      - "(?i)lego racers"
      - "(?i)v-rally"
      - "(?i)colin mcrae"
      - "(?i)nascar"
      - "(?i)pole position"
      - "(?i)full throttle"
      - "(?i)death valley rally"
      - "(?i)street racer"
      - "(?i)power drift"
      - "(?i)neo.?drift"
      - "(?i)trally"
      - "(?i)ndrift"
      - "(?i)speed racer"
      - "(?i)rally"
    exclude:
      - "(?i)\\[bios\\]"
      - "(?i)burn-in test"
      - "(?i)karate joe"
      - "(?i)space race"
      - "(?i)smurf"
      - "(?i)ant[sz] racing"
      - "(?i)halloween racer"
      - "(?i)boat racing"
      - "(?i)heracles"
      - "(?i)rocket racing"
      - "(?i)jockey"
      - "(?i)pingpong"
      - "(?i)controller kensa"
      - "(?i)stamp rally"
      - "(?i)world rally championship.*proto"
